spring:
  application:
    name: notification-system

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_system
    username: notification
    password: notification
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  task:
    scheduling:
      pool:
        # 기본값 1이면 여러 @Scheduled 작업이 같은 스레드를 공유한다.
        # 하나를 공유한다 — 한쪽이 대량 백로그를 처리하며 블로킹되면 나머지가 굶는다
        # (docs/decisions.md §5, 장애 주입 테스트로 실측된 알림 유실 원인 중 하나).
        # Relay 2개, Push worker, fan-out retry worker가 서로 굶지 않도록 4개를 둔다.
        size: 4

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-system
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

notification:
  subscriber-read-model:
    backfill:
      # 기존 구독 데이터가 있는 환경의 최초 배포/Read Model 재구축 때만 true로 실행한다.
      enabled: false
      page-size: 1000
